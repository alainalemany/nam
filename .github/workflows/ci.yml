name: NAM Dashboard CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nam-dashboard-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_VERSION: "22"
  PNPM_VERSION: "10.18.3"

jobs:
  application-quality:
    name: Application Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://ci_validate:unreachable@127.0.0.1:1/nam_ci_validate?connect_timeout=1

    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: false

      - name: Activate pnpm through Corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --version

      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      - name: Validate TypeScript explicitly
        run: pnpm exec tsc --noEmit

      - name: Run repository lint gate
        run: pnpm lint

      - name: Run unit and component tests
        run: pnpm test:run

      - name: Verify durable production Compose configuration
        run: pnpm test:infrastructure

      - name: Build production application
        run: pnpm build

      - name: Verify repository diff formatting
        run: git diff --check

  postgres-integration:
    name: PostgreSQL Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: nam_phase_a_integration_test
          POSTGRES_USER: nam_phase_a_test
          POSTGRES_PASSWORD: phase_a_ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nam_phase_a_test -d nam_phase_a_integration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: false

      - name: Activate pnpm through Corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --version

      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Verify Phase A database guard
        run: pnpm exec vitest run tests/unit/phase-a-postgres-guard.test.ts

      - name: Verify fresh migration chain
        env:
          PHASE_A_POSTGRES_REQUIRED: "1"
          PHASE_A_TEST_DATABASE_PROFILE: github-actions
          PHASE_A_TEST_DATABASE_URL: postgresql://nam_phase_a_test:phase_a_ci_only_password@127.0.0.1:5432/nam_phase_a_integration_test
        run: bash scripts/test/verify-payroll-fresh-migration-db.sh

      - name: Verify Payroll quarantine migration failure rollback
        env:
          PHASE_A_POSTGRES_REQUIRED: "1"
          PHASE_A_TEST_DATABASE_PROFILE: github-actions
          PHASE_A_TEST_DATABASE_URL: postgresql://nam_phase_a_test:phase_a_ci_only_password@127.0.0.1:5432/nam_phase_a_integration_test
        run: bash scripts/test/verify-payroll-quarantine-migration-failure.sh

      - name: Verify Payroll review-history migration failure rollback
        env:
          PHASE_A_POSTGRES_REQUIRED: "1"
          PHASE_A_TEST_DATABASE_PROFILE: github-actions
          PHASE_A_TEST_DATABASE_URL: postgresql://nam_phase_a_test:phase_a_ci_only_password@127.0.0.1:5432/nam_phase_a_integration_test
        run: bash scripts/test/verify-payroll-review-history-migration-failure.sh

      - name: Apply and verify migrations with synthetic legacy fixtures
        env:
          PHASE_A_POSTGRES_REQUIRED: "1"
          PHASE_A_TEST_DATABASE_PROFILE: github-actions
          PHASE_A_TEST_DATABASE_URL: postgresql://nam_phase_a_test:phase_a_ci_only_password@127.0.0.1:5432/nam_phase_a_integration_test
        run: |
          bash scripts/test/prepare-payroll-review-migration-db.sh

      - name: Verify Payroll review migration behavior
        env:
          PHASE_A_POSTGRES_REQUIRED: "1"
          PHASE_A_TEST_DATABASE_PROFILE: github-actions
          PHASE_A_TEST_DATABASE_URL: postgresql://nam_phase_a_test:phase_a_ci_only_password@127.0.0.1:5432/nam_phase_a_integration_test
        run: pnpm exec vitest run tests/integration/payroll-pr-review-migration-postgres.test.ts --reporter=verbose

      - name: Verify Payroll evidence-review actions and immutable history
        env:
          PHASE_A_POSTGRES_REQUIRED: "1"
          PHASE_A_TEST_DATABASE_PROFILE: github-actions
          PHASE_A_TEST_DATABASE_URL: postgresql://nam_phase_a_test:phase_a_ci_only_password@127.0.0.1:5432/nam_phase_a_integration_test
        run: pnpm exec vitest run tests/integration/payroll-evidence-review-postgres.test.ts --reporter=verbose

      - name: Verify progressive pay-rate observations and boundaries
        env:
          PHASE_A_POSTGRES_REQUIRED: "1"
          PHASE_A_TEST_DATABASE_PROFILE: github-actions
          PHASE_A_TEST_DATABASE_URL: postgresql://nam_phase_a_test:phase_a_ci_only_password@127.0.0.1:5432/nam_phase_a_integration_test
        run: pnpm exec vitest run tests/integration/payroll-rate-observations-postgres.test.ts --reporter=verbose

      - name: Run Phase A PostgreSQL integration tests
        env:
          PHASE_A_POSTGRES_REQUIRED: "1"
          PHASE_A_TEST_DATABASE_PROFILE: github-actions
          PHASE_A_TEST_DATABASE_URL: postgresql://nam_phase_a_test:phase_a_ci_only_password@127.0.0.1:5432/nam_phase_a_integration_test
        run: pnpm exec vitest run tests/integration/phase-a-postgres.test.ts --reporter=verbose

  payroll-rate-history-browser:
    name: Payroll Rate History Browser Acceptance
    needs:
      - application-quality
      - postgres-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PACKAGE_2B_BROWSER_TEST_MARKER: isolated-package-2b-browser-v1
      PACKAGE_2B_BROWSER_FIXTURE_MARKER: synthetic-payroll-evidence-v1
      PACKAGE_2B_BROWSER_TEST_DATABASE_URL: postgresql://nam_package2b_browser:synthetic_browser_ci_only@127.0.0.1:55441/nam_package2b_browser?schema=public
      PACKAGE_2B_BROWSER_AUTHORIZED_APP_DATABASE_URL: postgresql://nam_package2b_browser:synthetic_browser_ci_only@127.0.0.1:55441/nam_package2b_browser?schema=public
      PACKAGE_2B_BROWSER_MISMATCHED_APP_DATABASE_URL: postgresql://nam_package2b_browser:synthetic_browser_ci_only@127.0.0.1:55441/nam_package2b_browser?schema=public
      PACKAGE_2B_BROWSER_AUTHORIZED_ORIGIN: http://127.0.0.1:3102
      PACKAGE_2B_BROWSER_MISMATCHED_ORIGIN: http://127.0.0.1:3103
      PACKAGE_2B_BROWSER_OWNER_EMPLOYEE_ID: browser-owner
      PACKAGE_2B_BROWSER_AUTHORIZED_REVIEWER_EMPLOYEE_ID: browser-owner
      PACKAGE_2B_BROWSER_MISMATCHED_REVIEWER_EMPLOYEE_ID: browser-not-reviewer
      PACKAGE_2B_BROWSER_ACCESS_KEY: package2b-browser-access-key-000000000000
      PACKAGE_2B_BROWSER_SESSION_SECRET: package2b-browser-session-secret-0000000000

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: nam_package2b_browser
          POSTGRES_USER: nam_package2b_browser
          POSTGRES_PASSWORD: synthetic_browser_ci_only
        ports:
          - 55441:5432
        options: >-
          --health-cmd "pg_isready -U nam_package2b_browser -d nam_package2b_browser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: false

      - name: Activate pnpm through Corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --version

      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Apply migrations to isolated browser database
        env:
          DATABASE_URL: ${{ env.PACKAGE_2B_BROWSER_TEST_DATABASE_URL }}
        run: pnpm exec prisma migrate deploy

      - name: Build production application for browser acceptance
        env:
          DATABASE_URL: ${{ env.PACKAGE_2B_BROWSER_TEST_DATABASE_URL }}
          NAM_PAYROLL_OWNER_EMPLOYEE_ID: ${{ env.PACKAGE_2B_BROWSER_OWNER_EMPLOYEE_ID }}
          NAM_PAYROLL_EVIDENCE_REVIEWER_EMPLOYEE_ID: ${{ env.PACKAGE_2B_BROWSER_AUTHORIZED_REVIEWER_EMPLOYEE_ID }}
          NAM_PAYROLL_ACCESS_KEY: ${{ env.PACKAGE_2B_BROWSER_ACCESS_KEY }}
          NAM_PAYROLL_SESSION_SECRET: ${{ env.PACKAGE_2B_BROWSER_SESSION_SECRET }}
        run: pnpm build

      - name: Install isolated Chromium runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Run guarded progressive rate-history browser acceptance
        run: pnpm test:e2e:payroll-rate-history
